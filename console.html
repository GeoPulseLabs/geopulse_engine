<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Console Master de Gestão - Plataforma hip.hop</title>

<!-- QRCode.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
* { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
body { background: #edf2f7; margin: 0; padding: 20px; color: #2d3748; }
.container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }

/* Header Dinâmico */
header { border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
.brand-header { display: flex; align-items: center; gap: 15px; }
.brand-header img { height: 45px; width: auto; border-radius: 4px; }
.brand-titles h1 { margin: 0; color: #1a365d; font-size: 18px; }
.brand-titles h2 { margin: 2px 0 0 0; color: #718096; font-size: 13px; font-weight: normal; }
.badge-v3 { background: #1a365d; color: white; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; }

.section-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 12px; color: #4a5568; }
select, input { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 13px; margin-bottom: 10px; background: white; }
button { background: #1a365d; color: white; border: none; padding: 12px 18px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; font-size: 13px; }
button:hover { background: #2b6cb0; }

/* Grid de Auditoria da Planilha */
.audit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 12px; }
.audit-card { background: white; border: 1px solid #cbd5e0; border-radius: 6px; padding: 12px; text-align: center; }
.audit-card h3 { margin: 0; font-size: 20px; color: #1a365d; }
.audit-card p { margin: 4px 0 0 0; font-size: 11px; color: #718096; text-transform: uppercase; font-weight: bold; }

/* QR Code & Links */
.out-box { text-align: center; }
#qrcode { display: flex; justify-content: center; margin: 15px 0; }
.btn-group { display: flex; gap: 10px; justify-content: center; }
.btn-sec { background: #e67e22; }
.btn-sec:hover { background: #d35400; }

/* Dashboard Iframe GA4 / Looker */
.telemetry-frame { width: 100%; height: 600px; border: 1px solid #cbd5e0; border-radius: 6px; background: #ffffff; overflow: hidden; }
.telemetry-frame iframe { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand-header">
      <img id="logoConsole" alt="Logo" style="display: none;">
      <div class="brand-titles">
        <h1 id="tituloConsole">Carregando título...</h1>
        <h2 id="subtituloConsole">Console Master - Gestão Central DYART</h2>
      </div>
    </div>
    <span class="badge-v3">Master Console v3.0</span>
  </header>

  <!-- SELETOR DE MUNICÍPIOS (VISÍVEL NO MASTER) -->
  <div class="section-box">
    <label for="seletorMunicipio">🏙️ Selecione o Município para Gestão:</label>
    <select id="seletorMunicipio" onchange="alternarMunicipio()">
      <option value="">Carregando lista de municípios...</option>
    </select>
  </div>

  <!-- MÓDULO 1: AUDITORIA AUTOMÁTICA DA PLANILHA DO MUNICÍPIO -->
  <div class="section-box">
    <div id="audit-results">
      <label>Status e Diagnóstico do Município Selecionado:</label>
      <div class="audit-grid">
        <div class="audit-card"><h3 id="stat-status">--</h3><p>Conexão Planilha</p></div>
        <div class="audit-card"><h3 id="stat-pontos">0</h3><p>Pontos Mapeados</p></div>
        <div class="audit-card"><h3 id="stat-langs">--</h3><p>Idiomas Ativos</p></div>
        <div class="audit-card"><h3 id="stat-audios">0</h3><p>Áudios Vinculados</p></div>
      </div>
    </div>
  </div>

  <!-- MÓDULO 2: LINK PÚBLICO E QR CODE DO ROTEIRO -->
  <div id="out-section" class="section-box out-box" style="display:none;">
    <label>Link Público do Mapa (Turistas/Totens):</label>
    <input type="text" id="final-url" readonly>
    
    <div id="qrcode"></div>

    <div class="btn-group">
      <button class="btn-sec" onclick="copiarLink()">📋 Copiar Link</button>
      <button onclick="abrirMapa()">👁️ Abrir Mapa do Turista</button>
    </div>
  </div>

  <!-- MÓDULO 3: TELEMETRIA URBANA GA4 / LOOKER STUDIO -->
  <div class="section-box">
    <label>📊 Telemetria das Ruas (Acessos e Engajamento em Tempo Real - GA4):</label>
    <p style="font-size:11px; color:#718096; margin-top:0; margin-bottom:12px;">Métricas consolidadas de acessos aos balões, idiomas selecionados e acionamentos de áudio.</p>
    
    <div class="telemetry-frame" id="telemetry-container">
      <iframe 
        id="lookerIframe" 
        src="" 
        allowfullscreen 
        sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
      </iframe>
    </div>
  </div>
</div>

<script>
const ID_PLANILHA_PARAMETROS = '1034bcy9azlYnWKnTV-TdtbRg3eG-EJVt28dvaqwJGMY';

// 1. Carrega Título, Subtítulo e Logo da aba PARAMETROS
async function carregarParametrosGerais() {
    try {
        const urlGvizParam = `https://docs.google.com/spreadsheets/d/${ID_PLANILHA_PARAMETROS}/gviz/tq?tqx=out:json&sheet=PARAMETROS`;
        const resp = await fetch(urlGvizParam);
        const txt = await resp.text();
        const jsonPuro = JSON.parse(txt.substring(txt.indexOf('{'), txt.lastIndexOf('}') + 1));
        const rows = jsonPuro.table.rows || [];

        rows.forEach(r => {
            if(r && r.c && r.c[0] && r.c[1]) {
                const chave = String(r.c[0].v).toLowerCase().trim();
                let valor = String(r.c[1].v).trim();

                if(chave.includes('titulo') && !chave.includes('sub') && valor) {
                    document.getElementById('tituloConsole').innerText = valor;
                }
                if(chave.includes('subtitulo') && valor) {
                    document.getElementById('subtituloConsole').innerText = valor;
                }
                if(chave.includes('logo') && valor) {
                    valor = valor.replace('github.com', 'raw.githubusercontent.com')
                                 .replace('/blob/', '/')
                                 .replace('?raw=true', '');
                    const img = document.getElementById('logoConsole');
                    img.src = valor;
                    img.style.display = 'block';
                }
            }
        });
    } catch(e) {
        console.log("Erro ao carregar parâmetros gerais.");
    }
}

// 2. Carrega a lista de municípios (Lendo MUNICÍPIO, CÓDIGO, ID PLANILHA, LOOKER URL)
async function carregarListaMunicipios() {
    try {
        const urlGvizMun = `https://docs.google.com/spreadsheets/d/${ID_PLANILHA_PARAMETROS}/gviz/tq?tqx=out:json&sheet=MUNICIPIOS`;
        const resp = await fetch(urlGvizMun);
        const txt = await resp.text();
        const jsonPuro = JSON.parse(txt.substring(txt.indexOf('{'), txt.lastIndexOf('}') + 1));
        const rows = jsonPuro.table.rows || [];

        const select = document.getElementById('seletorMunicipio');
        select.innerHTML = '';

        const urlParams = new URLSearchParams(window.location.search);
        let codDaUrl = urlParams.get('cidade') ? decodeURIComponent(urlParams.get('cidade')).trim().toLowerCase() : '';
        if (window.location.hash) {
            codDaUrl += window.location.hash.toLowerCase().trim();
        }
        const idDaUrl = urlParams.get('id') ? urlParams.get('id').trim() : null;

        rows.forEach((r) => {
            if(r && r.c && r.c[0] && r.c[0].v) {
                const nomeMunicipio = String(r.c[0].v).trim();
                const codigoMunicipio = (r.c[1] && r.c[1].v) ? String(r.c[1].v).trim() : '';
                const idPlanilha = (r.c[2] && r.c[2].v) ? String(r.c[2].v).trim() : '';
                const urlLooker = (r.c[3] && r.c[3].v) ? String(r.c[3].v).trim() : '';

                const nomeLower = nomeMunicipio.toLowerCase();
                
                // Ignora o cabeçalho
                if(!nomeLower.includes('municipio') && !nomeLower.includes('município') && idPlanilha) {
                    const opt = document.createElement('option');
                    opt.value = idPlanilha;
                    opt.innerText = `${nomeMunicipio} [${codigoMunicipio || 'S/COD'}]`;
                    
                    if (urlLooker) opt.setAttribute('data-looker', urlLooker);
                    if (codigoMunicipio) opt.setAttribute('data-codigo', codigoMunicipio);

                    const codBancoClean = codigoMunicipio.toLowerCase().trim();

                    if (codDaUrl && codBancoClean === codDaUrl) {
                        opt.selected = true;
                    } else if (idDaUrl && idDaUrl === idPlanilha) {
                        opt.selected = true;
                    }

                    select.appendChild(opt);
                }
            }
        });

        if (select.value) {
            alternarMunicipio();
        } else {
            select.innerHTML = '<option value="">Nenhum município cadastrado</option>';
        }

    } catch(e) {
        console.log("Erro ao carregar aba MUNICIPIOS.");
        document.getElementById('seletorMunicipio').innerHTML = '<option value="">Erro ao carregar municípios</option>';
    }
}

// 3. Executado ao trocar o município no Menu Suspenso
function alternarMunicipio() {
    const select = document.getElementById('seletorMunicipio');
    const idSelecionada = select.value;
    const optionSelecionada = select.options[select.selectedIndex];
    
    if (idSelecionada) {
        const urlLookerEspecifica = optionSelecionada ? optionSelecionada.getAttribute('data-looker') : '';
        if (urlLookerEspecifica) {
            document.getElementById('lookerIframe').src = urlLookerEspecifica;
        }

        auditarMunicipio(idSelecionada);
    }
}

// 4. Audita a aba DADOS do município selecionado e gera o QR Code
async function auditarMunicipio(idPlanilhaDados) {
    try {
        const urlGviz = `https://docs.google.com/spreadsheets/d/${idPlanilhaDados}/gviz/tq?tqx=out:json&sheet=DADOS`;
        const resp = await fetch(urlGviz);
        const txt = await resp.text();
        const jsonPuro = JSON.parse(txt.substring(txt.indexOf('{'), txt.lastIndexOf('}') + 1));
        const rows = jsonPuro.table.rows || [];

        let totalPontos = 0;
        let totalAudios = 0;

        rows.forEach(r => {
            if(r && r.c && r.c[0] && r.c[0].v) {
                const nome = String(r.c[0].v).toLowerCase();
                if(!nome.includes("patrimonio") && !nome.includes("nome")) {
                    totalPontos++;
                    if(r.c[5] && r.c[5].v) totalAudios++;
                }
            }
        });

        document.getElementById("stat-status").innerText = "✅ OK";
        document.getElementById("stat-status").style.color = "#27ae60";
        document.getElementById("stat-pontos").innerText = totalPontos;
        document.getElementById("stat-langs").innerText = "PT / EN / ES";
        document.getElementById("stat-audios").innerText = totalAudios;

    } catch(e) {
        document.getElementById("stat-status").innerText = "⚠️ Erro Dados";
        document.getElementById("stat-status").style.color = "#e74c3c";
        document.getElementById("stat-pontos").innerText = "0";
        document.getElementById("stat-audios").innerText = "0";
    }

    const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
    const urlFinal = `${baseUrl}/index-2.html?id=${idPlanilhaDados}`;

    document.getElementById("final-url").value = urlFinal;
    document.getElementById("qrcode").innerHTML = "";
    
    new QRCode(document.getElementById("qrcode"), {
        text: urlFinal,
        width: 150,
        height: 150,
        colorDark: "#1a365d",
        colorLight: "#ffffff"
    });

    document.getElementById("out-section").style.display = "block";
}

function copiarLink() {
    const el = document.getElementById("final-url");
    el.select();
    document.execCommand("copy");
    alert("Link do mapa copiado com sucesso!");
}

function abrirMapa() {
    window.open(document.getElementById("final-url").value, '_blank');
}

// Inicialização Geral
window.onload = async () => {
    await carregarParametrosGerais();
    await carregarListaMunicipios();
};
</script>

<!-- Trava de Inspeção -->
<script>
  document.addEventListener('contextmenu', event => event.preventDefault());
  document.addEventListener('keydown', event => {
    if (
      event.key === 'F12' ||
      (event.ctrlKey && event.shiftKey && (event.key === 'I' || event.key === 'i' || event.key === 'J' || event.key === 'j' || event.key === 'C' || event.key === 'c')) ||
      (event.ctrlKey && (event.key === 'U' || event.key === 'u' || event.key === 'S' || event.key === 's'))
    ) {
      event.preventDefault();
      event.stopPropagation();
    }
  });
</script>

</body>
</html>
